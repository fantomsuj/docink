[project]
name = "docink"
version = "0.1.0"
description = "Agent-readable extraction of any source into markdown with stable IDs and addressable chunks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sujay Kolpuru" }]
keywords = ["markdown", "extraction", "agents", "llm", "mcp", "ingest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
web = ["trafilatura>=1.12"]
pdf = ["markitdown>=0.0.1a3"]
youtube = ["yt-dlp>=2024.9.0"]
office = ["markitdown>=0.0.1a3"]
mcp = ["fastmcp>=0.4"]
all = [
    "trafilatura>=1.12",
    "markitdown>=0.0.1a3",
    "yt-dlp>=2024.9.0",
    "fastmcp>=0.4",
]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.scripts]
docink = "docink.cli:main"
docink-mcp = "docink.mcp.server:main"

[project.urls]
Homepage = "https://github.com/docink/docink"
Issues = "https://github.com/docink/docink/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docink"]

[tool.pytest.ini_options]
testpaths = ["tests"]
